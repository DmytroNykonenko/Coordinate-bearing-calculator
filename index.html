<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coordinate & Bearing Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#182230;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:36px auto;padding:0 20px}.card{background:#fff;border:1px solid #dde4ee;border-radius:18px;box-shadow:0 12px 35px rgba(31,45,61,.08);overflow:hidden}.head{padding:28px 32px;background:#17324d;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.head h1{margin:0 0 8px;font-size:28px}.head p{margin:0;color:#d9e5ef}.lang{display:flex;border:1px solid #6d8499;border-radius:10px;overflow:hidden;flex:none}.lang button{border:0;padding:9px 12px;background:transparent;color:#fff;cursor:pointer}.lang button.active{background:#fff;color:#17324d}.body{padding:30px 32px}.grid{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:18px}.field label{font-weight:700;display:block;margin-bottom:8px}.field small{display:block;color:#697586;margin-top:6px}.drop{border:2px dashed #b7c4d3;border-radius:12px;padding:20px;background:#f8fafc;min-height:92px}.drop input{width:100%}select{width:100%;height:44px;border:1px solid #b9c5d1;border-radius:9px;padding:0 10px;background:#fff;font-size:15px}.status{margin-top:22px;border-radius:12px;padding:14px 16px;background:#f4f7fb;color:#4a5868;white-space:pre-line}.status.ok{background:#edf8f1;color:#17633a}.status.err{background:#fff0f0;color:#9f2626}.actions{display:flex;gap:12px;align-items:center;margin-top:22px}.primary{border:0;border-radius:10px;background:#17324d;color:white;font-weight:700;padding:13px 20px;cursor:pointer;font-size:15px}.primary:disabled{opacity:.45;cursor:not-allowed}.preview{margin-top:28px;overflow:auto}.preview h2{font-size:18px}.preview table{width:100%;border-collapse:collapse;min-width:820px}.preview th,.preview td{border:1px solid #d6dee8;padding:8px;text-align:center}.preview th{background:#e9eef5;font-size:13px}.area{font-weight:700;text-align:right;margin-top:12px}.foot{font-size:12px;color:#738092;margin-top:20px}@media(max-width:780px){.grid{grid-template-columns:1fr}.head{flex-direction:column}.body,.head{padding:22px}}
</style>
</head><body><div class="wrap"><div class="card"><header class="head"><div><h1 data-i="title">Калькулятор координат та азимутів</h1><p data-i="subtitle">Excel → азимути, відстані, площа → готовий Excel</p></div><div class="lang"><button id="ua" class="active">UA</button><button id="en">EN</button></div></header><main class="body"><div class="grid">
<div class="field"><label data-i="upload">1. Завантажте Excel з координатами</label><div class="drop"><input id="file" type="file" accept=".xlsx,.xls"><small data-i="columns">Очікувані поля: name, tp_utm_easting, tp_utm_northing</small></div></div>
<div class="field"><label data-i="zone">2. Система координат</label><select id="zone"><option value="36">WGS 1984 UTM Zone 36N</option><option value="37">WGS 1984 UTM Zone 37N</option></select></div>
<div class="field"><label data-i="decl">3. Магнітне схилення</label><select id="decl"><option value="8">8°</option><option value="9">9°</option></select></div></div>
<div id="status" class="status" data-i="waiting">Завантажте Excel-файл для початку.</div><div class="actions"><button id="generate" class="primary" disabled data-i="generate">Згенерувати Excel</button></div>
<section id="preview" class="preview" hidden><h2 data-i="preview">Попередній перегляд</h2><div id="table"></div><div id="area" class="area"></div></section>
<div class="foot" data-i="privacy">Розрахунок виконується у вашому браузері. Файл координат не завантажується на сервер.</div></main></div></div>
<script>
const I={uk:{title:'Калькулятор координат та азимутів',subtitle:'Excel → азимути, відстані, площа → готовий Excel',upload:'1. Завантажте Excel з координатами',columns:'Очікувані поля: name, tp_utm_easting, tp_utm_northing',zone:'2. Система координат',decl:'3. Магнітне схилення',waiting:'Завантажте Excel-файл для початку.',generate:'Згенерувати Excel',preview:'Попередній перегляд',privacy:'Розрахунок виконується у вашому браузері. Файл координат не завантажується на сервер.',loaded:n=>`✓ Завантажено ${n} точок\n✓ LM, BM та SP знайдено\n✓ Знайдено TP1–TP${n-3}`,bad:'Помилка: перевірте структуру файлу та координати.',missing:x=>`Помилка: відсутні точки: ${x}`,area:x=>`Загальна площа / Total area: ${x} м²`},en:{title:'Coordinate & Bearing Calculator',subtitle:'Excel → bearings, distances, area → ready Excel',upload:'1. Upload coordinate Excel file',columns:'Expected fields: name, tp_utm_easting, tp_utm_northing',zone:'2. Coordinate system',decl:'3. Magnetic declination',waiting:'Upload an Excel file to begin.',generate:'Generate Excel',preview:'Preview',privacy:'Calculations run in your browser. The coordinate file is not uploaded to a server.',loaded:n=>`✓ ${n} points loaded\n✓ LM, BM and SP detected\n✓ TP1–TP${n-3} detected`,bad:'Error: check the file structure and coordinate values.',missing:x=>`Error: missing points: ${x}`,area:x=>`Загальна площа / Total area: ${x} m²`}};
let lang='uk', points=null, rows=null, areaVal=0;
function tr(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=I[lang][e.dataset.i]);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.id===lang));if(points) setStatus(I[lang].loaded(points.size),'ok');render();}
ua.onclick=()=>{lang='uk';tr()};en.onclick=()=>{lang='en';tr()};
function setStatus(t,c=''){status.className='status '+c;status.textContent=t}
function norm(v){return String(v??'').trim().toUpperCase().replace(/\s+/g,'')}
file.onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const data=await f.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const a=XLSX.utils.sheet_to_json(ws,{defval:null});points=new Map();for(const r of a){const name=norm(r.name),x=Number(r.tp_utm_easting),y=Number(r.tp_utm_northing);if(name&&Number.isFinite(x)&&Number.isFinite(y))points.set(name,{name,x,y})}validate();calculate();generate.disabled=false;setStatus(I[lang].loaded(points.size),'ok');preview.hidden=false;render()}catch(err){points=null;generate.disabled=true;setStatus(I[lang].bad,'err')}};
function validate(){const missing=['LM','BM','SP'].filter(x=>!points.has(x));const tps=[...points.keys()].filter(x=>/^TP\d+$/.test(x)).sort((a,b)=>+a.slice(2)-+b.slice(2));if(!tps.length)missing.push('TP1…');if(missing.length)throw new Error(I[lang].missing(missing.join(', ')));for(let i=1;i<=tps.length;i++)if(!points.has('TP'+i))throw new Error(I[lang].missing('TP'+i))}
function bearing(a,b){let d=Math.atan2(b.x-a.x,b.y-a.y)*180/Math.PI;return(d+360)%360}
function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y)}
function calculate(){const tps=[...points.keys()].filter(x=>/^TP\d+$/.test(x)).sort((a,b)=>+a.slice(2)-+b.slice(2));const pairs=[['LM','BM'],['BM','SP'],['SP','TP1']];for(let i=0;i<tps.length-1;i++)pairs.push([tps[i],tps[i+1]]);pairs.push([tps.at(-1),'SP']);const dec=Number(decl.value);rows=pairs.map(([f,t])=>{const a=points.get(f),b=points.get(t),tb=bearing(a,b),mb=(tb-dec+360)%360;return{from:f,to:t,mag:Math.round(mb),trueb:Math.round(tb),distance:Math.round(dist(a,b)),x:Math.round(a.x),y:Math.round(a.y)}});let sum=0;const poly=['SP',...tps].map(n=>points.get(n));for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];sum+=p.x*q.y-q.x*p.y}areaVal=Math.round(Math.abs(sum)/2)}
decl.onchange=()=>{if(points){calculate();render()}};zone.onchange=()=>{if(points)render()};
function render(){if(!rows||preview.hidden)return;let h='<table><thead><tr><th>Від<br>From</th><th>До<br>To</th><th>Азимут (Магнітний)<br>Magnetic bearing</th><th>Азимут (Істинний)<br>True bearing</th><th>Відстань (м)<br>Distance</th><th>Long/UTMX</th><th>Lat/UTMY</th></tr></thead><tbody>';for(const r of rows)h+=`<tr><td>${r.from}</td><td>${r.to}</td><td>${r.mag}</td><td>${r.trueb}</td><td>${r.distance}</td><td>${String(r.x).padStart(7,'0')}</td><td>${r.y}</td></tr>`;h+='</tbody></table>';table.innerHTML=h;area.textContent=I[lang].area(areaVal)}
generate.onclick=()=>{calculate();render();const aoa=[['Від\nFrom','До\nTo','Азимут (Магнітний)\nMagnetic bearing','Азимут (Істинний)\nTrue bearing','Відстань(м)\nDistance','Long/UTMX','Lat/UTMY'],...rows.map(r=>[r.from,r.to,r.mag,r.trueb,r.distance,String(r.x).padStart(7,'0'),r.y]),['Загальна площа вивільненої ділянки (кв.м.) / The total area of the released area (sq.m.):','','','','','',areaVal]];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:12},{wch:12},{wch:25},{wch:23},{wch:18},{wch:16},{wch:16}];ws['!rows']=[{hpt:54}];const range=XLSX.utils.decode_range(ws['!ref']);for(let C=0;C<=range.e.c;C++){const cell=ws[XLSX.utils.encode_cell({r:0,c:C})];if(cell)cell.s={font:{bold:true},alignment:{horizontal:'center',vertical:'center',wrapText:true}}}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bearing Table');XLSX.writeFile(wb,'bearing_calculation.xlsx')};
</script></body></html>
